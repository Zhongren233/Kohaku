# 发布到 GitHub Packages（Maven）。
# 触发：发布（publish）一个 GitHub Release，或手动 workflow_dispatch 指定版本号。
# 版本号取自 Release 的 tag（去掉可选的 v 前缀），因此 tag 必须就是版本号本身，例如 0.1.0。
# 参见 https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 手动发布时使用的版本号（不含 v 前缀），例如 0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: maven-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github # 与 pom.xml 里 distributionManagement/repository/id 一致
          settings-path: ${{ github.workspace }} # 生成 settings.xml 的位置

      - name: Resolve version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            raw="$TAG_NAME"
          else
            raw="$INPUT_VERSION"
          fi
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Set project version
        run: ./mvnw -B -ntp versions:set -DnewVersion="${{ steps.version.outputs.version }}" -DgenerateBackupPoms=false

      - name: Build and publish to GitHub Packages
        run: ./mvnw -B -ntp deploy -s "$GITHUB_WORKSPACE/settings.xml"
        env:
          GITHUB_TOKEN: ${{ github.token }}
