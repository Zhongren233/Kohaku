spring:
  application:
    name: kohaku
  config:
    # 私有凭据不落库（secrets/ 已 gitignore），可用环境变量 KOHAKU_QQ_APPID / KOHAKU_QQ_APPSECRET 覆盖。
    # file: 相对路径按「进程工作目录」解析，这里把两种常见工作目录都列上：
    import:
      - optional:file:./secrets/qq-bot.yaml                 # 工作目录 = kohaku-example/
      - optional:file:./kohaku-example/secrets/qq-bot.yaml  # 工作目录 = 仓库根

kohaku:
  qq:
    # app-id / app-secret 见上述导入文件（勿写入本文件）
    intents: # 多选枚举，默认 [PUBLIC_GUILD_MESSAGES]（频道内 @机器人 消息）
      - PUBLIC_GUILD_MESSAGES    # 基础权限
      - GROUP_AND_C2C_EVENT      # 群/单聊事件，需在开放平台申请
      - INTERACTION              # 按钮/快捷菜单等互动回调，需在开放平台申请；缺它按钮点击不会下发
    # 以下均为默认值，按需覆盖即可
    # api-base-url: https://api.bot.qq.com   # 沙箱：https://sandbox.api.bot.qq.com
    # token-url: https://api.bot.qq.com/app/getAppAccessToken
    # handler-order:               # 事件处理器执行顺序（Bean 名称；未列出的按 @Order 排在其后）
    #   - echoC2cHandler
    #   - echoGroupHandler
    # shard-index: 0
    # shard-total: 1
    # client-name: kohaku
    # auto-start: true
    # reconnect-initial-delay: 1s
    # reconnect-max-delay: 60s
